version: "3"

# Task runner (https://taskfile.dev) entrypoints. Install once with
# `brew install go-task/tap/go-task` or `go install github.com/go-task/task/v3/cmd/task@latest`.
#
# Common flows:
#   task dev           — inner-loop (host backend + Vite HMR + Postgres in compose)
#   task up            — "closer to prod" fat-JAR run via compose.dev.yml
#   task down          — stop everything and remove compose containers
#   task test          — full suite (backend verify + every frontend vitest + shared bun test)
#   task codegen       — regenerate jOOQ sources against a Testcontainers Postgres
#   task frontends     — build the SPAs into src/main/resources/static
#   task format        — spotless:apply (java) + prettier --write (frontends)
#   task hooks:install — install lefthook git hooks (prettier + IIKIT chain)

vars:
  COMPOSE_BASE: docker-compose.yml
  COMPOSE_DEV: compose.dev.yml

tasks:
  default:
    desc: List the tasks in this file
    cmds:
      - task --list

  # ---------- Docker Compose orchestration --------------------------------

  postgres:up:
    desc: Start Postgres in the background and wait for readiness
    cmds:
      - docker compose -f {{.COMPOSE_BASE}} up -d postgres
      - |
        for _ in $(seq 1 30); do
          if docker compose -f {{.COMPOSE_BASE}} exec -T postgres pg_isready -U polls >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        echo "postgres did not become ready in 30s"; exit 1

  postgres:down:
    desc: Stop Postgres (leaves the compose.dev.yml backend if it was up)
    cmds:
      - docker compose -f {{.COMPOSE_BASE}} down

  up:
    desc: Build and run the full fat-JAR stack (Postgres + backend on :8080)
    deps: [codegen]
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} up --build

  up:detached:
    desc: Same as `up` but in the background
    deps: [codegen]
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} up --build -d

  down:
    desc: Stop every compose project (compose.dev.yml + docker-compose.yml) and remove containers
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} down
      - docker compose -f {{.COMPOSE_BASE}} down

  logs:
    desc: Tail the backend container logs
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} logs -f backend

  # ---------- Inner-loop dev ----------------------------------------------

  dev:
    desc: Inner-loop (host spring-boot:run + Vite dev servers + Postgres in compose)
    cmds:
      - bash scripts/dev.sh

  dev:h2:
    desc: Inner-loop on H2 file-mode (no Docker required)
    deps: [codegen]
    cmds:
      - |
        SPRING_DATASOURCE_URL='jdbc:h2:file:${SP_DATA_DIR:-./data}/polls;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE' \
        SPRING_DATASOURCE_USERNAME=sa \
        SPRING_DATASOURCE_PASSWORD='' \
        ./mvnw spring-boot:run -Dspotless.check.skip=true

  # ---------- Build surfaces ----------------------------------------------

  frontends:
    desc: Build the voter + backoffice SPAs into src/main/resources/static
    cmds:
      - bash scripts/build-frontends.sh

  codegen:
    desc: Regenerate jOOQ sources against a Testcontainers Postgres (needed before mvn package)
    cmds:
      - ./mvnw -Pcodegen compile -Dspotless.check.skip=true

  package:
    desc: Build the fat JAR on the host (runs codegen first)
    deps: [codegen, frontends]
    cmds:
      - ./mvnw package -DskipTests -Dspotless.check.skip=true

  # ---------- Tests --------------------------------------------------------

  test:
    desc: Full feature suite — backend verify + every frontend test runner
    cmds:
      - task: test:backend
      - task: test:shared
      - task: test:voter
      - task: test:backoffice
      - task: test:slidev
      - task: test:e2e

  test:backend:
    desc: Run the Maven reactor tests (unit + integration)
    cmds:
      - ./mvnw verify -Dspotless.check.skip=true

  test:shared:
    desc: Run vitest for @slidev-polls/shared
    dir: frontends/shared
    cmds:
      - bun run test

  test:voter:
    desc: Run Vitest for the voter SPA
    dir: frontends/voter
    cmds:
      - bun run test

  test:backoffice:
    desc: Run Vitest for the backoffice SPA
    dir: frontends/backoffice
    cmds:
      - bun run test

  test:slidev:
    desc: Run Vitest for the Slidev addon
    dir: frontends/slidev-component
    cmds:
      - bun run test

  slidev:demo:
    desc: Launch the Slidev demo deck (auto-starts compose.dev.yml backend if :8080 is idle; tears down what it started). Sign into the backoffice yourself, create a poll, and use "Copy snippet" to paste <PollResults> tags into slides.md.
    dir: frontends/slidev-demo
    cmds:
      - task: frontends
      - task: e2e:backend-up
      - defer: { task: e2e:backend-down }
      # Ensure slidev CLI + addon are resolved for the workspace — cheap when
      # already installed (bun reports "no changes"). Runs at the workspace
      # root since workspace:* links only resolve from there.
      - bun install --cwd ..
      - bun run slidev

  test:e2e:
    desc: Run Playwright across voter + slidev projects against one compose.dev.yml backend (auto-starts if :8080 is idle; tears down what it started)
    dir: frontends
    cmds:
      - task: e2e:backend-up
      - defer: { task: e2e:backend-down }
      # Both projects share frontends/playwright.config.ts. Running playwright
      # without --project picks up every project (voter-chromium + slidev-chromium)
      # and reuses the single webServer (the slidev demo dev server).
      - bunx playwright test --config=./playwright.config.ts

  e2e:backend-up:
    desc: (internal) Bring up compose.dev.yml iff nothing is already listening on PW_BASE_URL
    internal: true
    vars:
      E2E_BASE_URL: '{{.PW_BASE_URL | default "http://localhost:8080"}}'
      E2E_MARKER: '{{.TASKFILE_DIR}}/.task-e2e-backend-started'
    cmds:
      - |
        if curl -sf --max-time 2 "{{.E2E_BASE_URL}}/" >/dev/null 2>&1; then
          echo "[e2e] backend already reachable at {{.E2E_BASE_URL}} — reusing (no teardown)"
          rm -f {{.E2E_MARKER}}
          exit 0
        fi
        echo "[e2e] no backend at {{.E2E_BASE_URL}}; bringing up compose.dev.yml"
        touch {{.E2E_MARKER}}
      # codegen + compose build run sequentially. codegen spawns its own
      # ephemeral Testcontainers Postgres for jOOQ generation, then
      # compose.dev.yml brings up the runtime Postgres + backend.
      - |
        if [ -f {{.E2E_MARKER}} ]; then
          {{.TASK_EXE}} codegen
          docker compose -f {{.COMPOSE_DEV}} up --build -d
          for _ in $(seq 1 300); do
            if curl -sf --max-time 2 "{{.E2E_BASE_URL}}/" >/dev/null 2>&1; then
              echo "[e2e] backend ready at {{.E2E_BASE_URL}}"
              exit 0
            fi
            sleep 1
          done
          echo "[e2e] backend did not become ready within 300s" >&2
          docker compose -f {{.COMPOSE_DEV}} logs --tail=200 backend >&2 || true
          exit 1
        fi

  e2e:backend-down:
    desc: (internal) Tear down compose.dev.yml iff this run brought it up
    internal: true
    vars:
      E2E_MARKER: '{{.TASKFILE_DIR}}/.task-e2e-backend-started'
    cmds:
      - |
        if [ -f {{.E2E_MARKER}} ]; then
          echo "[e2e] tearing down compose.dev.yml (started by this run)"
          docker compose -f {{.COMPOSE_DEV}} down
          rm -f {{.E2E_MARKER}}
        else
          echo "[e2e] backend was pre-existing; skipping teardown"
        fi

  # ---------- Hygiene ------------------------------------------------------

  format:
    desc: Apply spotless (java) and prettier --write (frontends) across the repo
    cmds:
      - ./mvnw spotless:apply
      - cd frontends && bun run format:write

  hooks:install:
    desc: Install lefthook git hooks (prettier on commit + IIKIT assertion check)
    cmds:
      # lefthook moves any pre-existing .git/hooks/pre-commit aside as
      # pre-commit.old on first install; lefthook.yml's iikit job re-invokes
      # that snapshot. Re-running this task is safe — lefthook is idempotent.
      - cd frontends && bunx lefthook install

  clean:
    desc: Clean Maven and frontend build outputs
    cmds:
      - ./mvnw clean
      - rm -rf frontends/*/dist
      - rm -rf src/main/resources/static
