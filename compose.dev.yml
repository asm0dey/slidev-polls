# One-command dev stack: Postgres + a native-image backend container that serves
# both SPAs from the same origin. Use `task up` (from the repo Taskfile) — it
# runs the jOOQ codegen against Postgres before `docker compose build`, which is
# what the reactor's poll-persistence module needs (and what the native build's
# COPY target/generated-sources expects).
#
# For inner-loop work with Vite HMR and `mvnw quarkus:dev` on the host, use
# `task dev` instead — this file targets the "closer to prod" flow.

services:
  postgres:
    image: postgres:18-alpine
    container_name: slidev-polls-postgres
    environment:
      POSTGRES_DB: polls
      POSTGRES_USER: polls
      POSTGRES_PASSWORD: polls
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polls -d polls"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slidev-polls-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Override the application.properties prod defaults (which point at
      # localhost:5432) so the backend reaches the sibling service over the
      # compose network. Quarkus maps these env vars onto config keys.
      QUARKUS_DATASOURCE_POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/polls
      QUARKUS_DATASOURCE_POSTGRES_USERNAME: polls
      QUARKUS_DATASOURCE_POSTGRES_PASSWORD: polls
      # The session cookie encryption key (>= 32 bytes). Change for any real
      # deployment; the application.properties default is a dev placeholder.
      SP_SESSION_KEY: ${SP_SESSION_KEY:-dev-only-change-me-32-bytes-minimum!!}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
