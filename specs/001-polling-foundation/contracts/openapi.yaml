openapi: 3.0.3
info:
  title: Slidev Polls — Core Polling Platform
  version: 0.2.0
  description: >
    Contract for the HTTP surface of the Slidev Polls backend
    (feature 001-polling-foundation). The backend is a single Spring
    Boot service that also serves the voter and backoffice SPAs as
    static resources. /api/admin/** requires an authenticated session;
    /api/polls/** and /api/public/** are public.

servers:
  - url: http://localhost:8080

tags:
  - name: admin-auth
  - name: admin-polls
  - name: admin-style
  - name: admin-qr
  - name: admin-deck-tokens
  - name: deck
  - name: public-polls
  - name: public-votes
  - name: public-stream
  - name: spa

paths:
  /:
    get:
      tags: [spa]
      summary: Voter SPA landing page.
      responses:
        '200': { description: HTML shell for the voter SPA. }

  /{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [spa]
      summary: >
        Voter SPA shell for a specific poll (memorable URL). The SPA
        resolves the slug via /api/polls/by-slug/{slug}.
      responses:
        '200': { description: HTML shell for the voter SPA. }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/:
    get:
      tags: [spa]
      summary: Backoffice SPA shell (unauthenticated shell; routes gated by /api/admin/**).
      responses:
        '200': { description: HTML shell for the backoffice SPA. }

  /api/admin/login:
    post:
      tags: [admin-auth]
      summary: Sign in as a presenter.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '204': { description: Sign-in succeeded; session cookie set. }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/admin/logout:
    post:
      tags: [admin-auth]
      security: [{ sessionAuth: [] }]
      responses:
        '204': { description: Session cleared. }

  /api/admin/polls:
    get:
      tags: [admin-polls]
      summary: List polls owned by the current presenter.
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: Polls owned by the caller.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Poll' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [admin-polls]
      summary: Create a new poll (server may derive a slug from the title if omitted).
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePollRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PollDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: Slug collision, reserved slug, or invalid slug format.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/admin/polls/{pollId}:
    parameters:
      - $ref: '#/components/parameters/PollId'
    get:
      tags: [admin-polls]
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: Poll detail including questions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PollDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [admin-polls]
      summary: Update poll title, slug, questions, or options.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePollRequest' }
      responses:
        '200':
          description: Updated poll detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PollDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Slug collision, reserved slug, or invalid slug format.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [admin-polls]
      security: [{ sessionAuth: [] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/polls/{pollId}/open:
    parameters:
      - $ref: '#/components/parameters/PollId'
    post:
      tags: [admin-polls]
      summary: Activate a question on this poll (body names which one); atomically closes any currently active question on the same poll.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivateQuestionRequest' }
      responses:
        '200':
          description: Resulting poll state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PollDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Question cannot be activated (e.g., fewer than two options, or already closed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/admin/polls/{pollId}/close:
    parameters:
      - $ref: '#/components/parameters/PollId'
    post:
      tags: [admin-polls]
      summary: Close the currently active question on this poll.
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: Resulting poll state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PollDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/polls/{pollId}/style:
    parameters:
      - $ref: '#/components/parameters/PollId'
    put:
      tags: [admin-style]
      summary: Replace the poll's style object (colors, font, layout).
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PollStyle' }
      responses:
        '200':
          description: Updated poll detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PollDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/polls/{pollId}/qr.png:
    parameters:
      - $ref: '#/components/parameters/PollId'
    get:
      tags: [admin-qr]
      summary: PNG QR code for the poll's public slug URL.
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: PNG image.
          content:
            image/png:
              schema: { type: string, format: binary }

  /api/admin/polls/{pollId}/deck-tokens:
    parameters:
      - $ref: '#/components/parameters/PollId'
    get:
      tags: [admin-deck-tokens]
      summary: List deck tokens issued for this poll (hashes / metadata only; plaintext is never returned again after mint).
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: Deck tokens for this poll.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeckToken' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-deck-tokens]
      summary: Mint a new deck token for this poll. The plaintext value is returned ONCE in this response.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MintDeckTokenRequest' }
      responses:
        '201':
          description: Token minted. `plaintext` is shown once; only its hash is persisted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeckTokenMinted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/polls/{pollId}/deck-tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/PollId'
      - in: path
        name: tokenId
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [admin-deck-tokens]
      summary: Revoke a deck token.
      security: [{ sessionAuth: [] }]
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/deck/polls/{pollId}/activate:
    parameters:
      - $ref: '#/components/parameters/PollId'
    post:
      tags: [deck]
      summary: >
        Slidev-deck-initiated activation of a specific question. Called
        by the addon on slide mount (FR-018). Authorised by an
        `X-Deck-Token` header carrying a valid, non-revoked deck token
        scoped to `pollId` (FR-019). Idempotent: activating an already-
        active question is a no-op.
      security: [{ deckToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivateQuestionRequest' }
      responses:
        '200':
          description: Resulting poll state (same shape as backoffice activate).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PollDetail' }
        '401':
          description: Missing, unknown, or revoked deck token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Token is valid but scoped to a different poll.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Question cannot be activated (e.g., fewer than two options).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/polls/by-slug/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [public-polls]
      summary: Public view of a poll (active question + options + style + already-voted hint).
      responses:
        '200':
          description: Public poll view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicPollView' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/polls/{slug}/votes:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [public-votes]
      summary: Submit a vote on the poll's currently active question.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoteRequest' }
      responses:
        '201':
          description: Vote accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoteAccepted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Rejected — already voted (ALREADY_VOTED) or question no longer active (QUESTION_NOT_ACTIVE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/polls/{slug}/stream:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [public-stream]
      summary: >
        Server-Sent Events stream. Emits `snapshot` on connect / active-question
        change, `tally` on each accepted vote, `question-closed` on close.
      responses:
        '200':
          description: text/event-stream of poll events.
          content:
            text/event-stream:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
    deckToken:
      type: apiKey
      in: header
      name: X-Deck-Token

  parameters:
    PollId:
      in: path
      name: pollId
      required: true
      schema: { type: string, format: uuid }
    Slug:
      in: path
      name: slug
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 40

  responses:
    Unauthenticated:
      description: Caller is not authenticated.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Caller is authenticated but does not own the resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: Request body failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - AUTH_REQUIRED
            - FORBIDDEN
            - NOT_FOUND
            - VALIDATION_FAILED
            - ALREADY_VOTED
            - QUESTION_NOT_ACTIVE
            - ACTIVATION_REJECTED
            - SLUG_TAKEN
            - SLUG_INVALID
            - SLUG_RESERVED
            - DECK_TOKEN_INVALID
            - DECK_TOKEN_POLL_MISMATCH
            - TRANSPORT_FAILURE
        message:
          type: string
          description: User-facing, non-technical message.
        correlationId:
          type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    CreatePollRequest:
      type: object
      required: [title, questions]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          description: >
            Optional desired slug. If omitted, the server derives a
            slug from the title. If present, must match the slug
            format and must not be in the reserved list.
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 40
        style: { $ref: '#/components/schemas/PollStyle' }
        questions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateQuestionRequest' }

    UpdatePollRequest:
      type: object
      description: Patch-style update. Any field may be omitted.
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 40
        questions:
          type: array
          items: { $ref: '#/components/schemas/CreateQuestionRequest' }

    CreateQuestionRequest:
      type: object
      required: [prompt, options]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 500 }
        options:
          type: array
          minItems: 2
          items:
            type: object
            required: [label]
            properties:
              label: { type: string, minLength: 1, maxLength: 200 }

    ActivateQuestionRequest:
      type: object
      required: [questionId]
      properties:
        questionId: { type: string, format: uuid }

    PollStyle:
      type: object
      description: Theme overrides persisted as jsonb. All fields optional.
      properties:
        primaryColor: { type: string, description: 'CSS color; e.g. #ff6600' }
        accentColor:  { type: string }
        backgroundColor: { type: string }
        fontFamily:   { type: string }
        layout:
          type: string
          enum: [BARS, COLUMNS, DONUT]

    Poll:
      type: object
      required: [id, title, slug, status, publicUrl]
      properties:
        id:     { type: string, format: uuid }
        title:  { type: string }
        slug:   { type: string }
        status: { type: string, enum: [DRAFT, OPEN, CLOSED] }
        publicUrl: { type: string, format: uri }
        activeQuestionId: { type: string, format: uuid, nullable: true }

    PollDetail:
      allOf:
        - $ref: '#/components/schemas/Poll'
        - type: object
          required: [questions, style]
          properties:
            style: { $ref: '#/components/schemas/PollStyle' }
            questions:
              type: array
              items: { $ref: '#/components/schemas/Question' }

    Question:
      type: object
      required: [id, prompt, status, ordinal, options]
      properties:
        id: { type: string, format: uuid }
        prompt: { type: string }
        status:
          type: string
          enum: [DRAFT, ACTIVE, CLOSED]
        ordinal: { type: integer }
        options:
          type: array
          items: { $ref: '#/components/schemas/Option' }

    Option:
      type: object
      required: [id, label, position]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        position: { type: integer }

    PublicPollView:
      type: object
      required: [pollId, slug, title, state, style]
      properties:
        pollId: { type: string, format: uuid }
        slug:   { type: string }
        title:  { type: string }
        state:
          type: string
          enum: [WAITING, ACTIVE]
        style: { $ref: '#/components/schemas/PollStyle' }
        activeQuestion:
          $ref: '#/components/schemas/Question'
        alreadyVoted:
          type: boolean
          description: Best-effort hint derived from the voter_token cookie.

    VoteRequest:
      type: object
      required: [optionId, voterToken]
      properties:
        optionId: { type: string, format: uuid }
        voterToken:
          type: string
          description: UUID generated client-side and persisted in localStorage; also sent in cookie.

    MintDeckTokenRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 120
          description: Optional human-facing label.

    DeckToken:
      type: object
      required: [id, pollId, createdAt, revoked]
      properties:
        id: { type: string, format: uuid }
        pollId: { type: string, format: uuid }
        label: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }
        revoked: { type: boolean }

    DeckTokenMinted:
      allOf:
        - $ref: '#/components/schemas/DeckToken'
        - type: object
          required: [plaintext]
          properties:
            plaintext:
              type: string
              description: >
                The bearer value to embed as the addon's `deckToken` prop. Shown once;
                the backend stores only its SHA-256 hash.

    VoteAccepted:
      type: object
      required: [voteId, recordedAt]
      properties:
        voteId: { type: string, format: uuid }
        recordedAt: { type: string, format: date-time }
