name: Test & Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # No Postgres service needed: the jOOQ codegen step now uses
    # testcontainers-jooq-codegen-maven-plugin (Docker-on-runner), and
    # mvn verify integration tests already use Spring Boot's Testcontainers
    # support.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: liberica
          java-version: '25'
          cache: maven

      - name: jOOQ codegen
        run: ./mvnw -B -ntp -Pcodegen -pl backend/poll-persistence -am compile -Dspotless.check.skip=true

      - name: Maven verify (unit + integration tests)
        run: ./mvnw -B -ntp verify -Dspotless.check.skip=true

      - name: Upload Surefire/Failsafe reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: |
            backend/**/target/surefire-reports/**
            backend/**/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7

  frontends:
    name: Frontends (Bun test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontends

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format

      - name: Test (vitest + bun test across workspaces)
        run: bun --filter='*' run test

      - name: Build SPAs
        run: bun --filter='*' run build

      - name: Upload built SPAs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontends/*/dist
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: E2E (Playwright voter + slidev)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontends]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: liberica
          java-version: '25'
          cache: maven

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install go-task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install frontend dependencies
        working-directory: frontends
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontends
        # --with-deps installs the apt packages chromium needs on a clean ubuntu-latest
        # image. We pin to chromium because both projects in playwright.config.ts use
        # devices["Desktop Chrome"] — adding firefox/webkit here just inflates the cache.
        run: bunx playwright install --with-deps chromium

      - name: Run e2e suite
        # task test:e2e runs `task e2e:backend-up` (which runs jOOQ codegen via mvnw on
        # the host, then `docker compose -f compose.dev.yml up --build -d`) and then
        # invokes Playwright across both projects against http://localhost:8080.
        run: task test:e2e
        env:
          # Force colourised reporter output off — github runners don't render it cleanly.
          FORCE_COLOR: '0'

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose -f compose.dev.yml logs --tail=400 backend || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontends/playwright-report/**
            frontends/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  publish-backend:
    name: Publish backend image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend, frontends, e2e]
    # Only on a semver tag push. Skipped for branch pushes and pull_request.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Derive image tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/slidev-polls-backend
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # github.ref_name is the tag name (e.g. v0.0.1)
          if [[ "${REF_NAME}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            echo "::error::Ref '${REF_NAME}' is not a vX.Y.Z tag" >&2
            exit 1
          fi
          {
            echo "list<<EOF"
            echo "${IMAGE}:${major}.${minor}.${patch}"
            echo "${IMAGE}:${major}.${minor}"
            echo "${IMAGE}:sha-${SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontends, e2e]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      # id-token is required for npm Trusted Publishing (OIDC). No NPM_TOKEN
      # secret is needed once each package has a Trusted Publisher configured.
      id-token: write
    defaults:
      run:
        working-directory: frontends

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Derive version from tag
        id: ver
        working-directory: ${{ github.workspace }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version '$v' is not valid semver" >&2
            exit 1
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Set up Node.js (for npm Trusted Publishing)
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Set package versions
        env:
          V: ${{ steps.ver.outputs.v }}
        run: |
          (cd shared && npm pkg set version="$V")
          (cd slidev-component && npm pkg set version="$V")
          # npm publish does not rewrite workspace:* like bun/pnpm do, so pin
          # the cross-package dependency to the concrete release version.
          (cd slidev-component && npm pkg set "dependencies.@slidev-polls/shared"="$V")

      - name: Publish @slidev-polls/shared
        working-directory: frontends/shared
        run: npm publish --access public --provenance

      - name: Publish @slidev-polls/component
        working-directory: frontends/slidev-component
        run: npm publish --access public --provenance

      - name: Job summary
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          V: ${{ steps.ver.outputs.v }}
        run: |
          {
            echo "## npm publish"
            echo ""
            echo "Version: \`$V\`"
            echo ""
            echo "- @slidev-polls/shared@$V"
            echo "- @slidev-polls/component@$V"
          } >> "$GITHUB_STEP_SUMMARY"
