name: Test & Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # No Postgres service needed: the jOOQ codegen step now uses
    # testcontainers-jooq-codegen-maven-plugin (Docker-on-runner), and
    # mvn verify integration tests already use Spring Boot's Testcontainers
    # support.
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: liberica
          java-version: '25'
          cache: maven

      - name: jOOQ codegen
        run: ./mvnw -B -ntp -Pcodegen compile -Dspotless.check.skip=true

      - name: Maven verify (unit + integration tests)
        run: ./mvnw -B -ntp verify -Dspotless.check.skip=true

      - name: Upload Surefire/Failsafe reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7

  frontends:
    name: Frontends (Bun test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontends

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format

      - name: Test (vitest + bun test across workspaces)
        run: bun --filter='*' run test

      - name: Build SPAs
        run: bun --filter='*' run build

      - name: Upload built SPAs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontends/*/dist
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: E2E (Playwright voter + slidev)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontends]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: liberica
          java-version: '25'
          cache: maven

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install go-task
        # Upstream arduino/setup-task@v2.0.0 (last release: 2024-02) still runs on
        # Node 20, which GitHub deprecated on 2025-09-19 and will remove from
        # runners on 2026-09-16. No newer release exists, so install Task from
        # the official installer instead. RUNNER_TEMP/bin is prepended to PATH
        # via GITHUB_PATH so every subsequent step can call `task`.
        run: |
          curl --silent --location --fail https://taskfile.dev/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontends
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontends
        # --with-deps installs the apt packages chromium needs on a clean ubuntu-latest
        # image. We pin to chromium because both projects in playwright.config.ts use
        # devices["Desktop Chrome"] — adding firefox/webkit here just inflates the cache.
        run: bunx playwright install --with-deps chromium

      - name: Run e2e suite
        # task test:e2e runs `task e2e:backend-up` (which runs jOOQ codegen via mvnw on
        # the host, then `docker compose -f compose.dev.yml up --build -d`) and then
        # invokes Playwright across both projects against http://localhost:8080.
        run: task test:e2e
        env:
          # Force colourised reporter output off — github runners don't render it cleanly.
          FORCE_COLOR: '0'

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose -f compose.dev.yml logs --tail=400 backend || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontends/playwright-report/**
            frontends/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  publish-backend:
    name: Publish backend image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs: [backend, frontends, e2e]
    # Only on a semver tag push. Skipped for branch pushes and pull_request.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    strategy:
      # Each matrix entry builds and pushes the image by digest only (no tags),
      # then the publish-backend-manifest job below stitches the digests into
      # a multi-arch manifest list under the real tags. Native ARM runners
      # avoid QEMU emulation entirely.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: liberica
          java-version: '25'
          cache: maven

      - name: jOOQ codegen
        # The Dockerfile expects target/generated-sources/jooq to already
        # exist in the build context — codegen uses Testcontainers and so
        # can't run inside `docker build`. Materialise the sources on the
        # runner first; .dockerignore lets target/generated-sources through.
        run: ./mvnw -B -ntp -Pcodegen compile -Dspotless.check.skip=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          # No tags here — the manifest job assigns them once both arches are pushed.
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/slidev-polls-backend,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-backend-manifest:
    name: Combine backend image manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [publish-backend]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digest artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: backend-digests-*
          merge-multiple: true

      - name: Derive image tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/slidev-polls-backend
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${REF_NAME}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            echo "::error::Ref '${REF_NAME}' is not a vX.Y.Z tag" >&2
            exit 1
          fi
          # imagetools create --tag accepts repeated --tag flags. Emit one line
          # per tag, picked up by the create step below as -t arguments.
          {
            echo "args<<EOF"
            echo "-t ${IMAGE}:${major}.${minor}.${patch}"
            echo "-t ${IMAGE}:${major}.${minor}"
            echo "-t ${IMAGE}:sha-${SHA}"
            echo "-t ${IMAGE}:latest"
            echo "EOF"
            echo "image=${IMAGE}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          TAG_ARGS: ${{ steps.tags.outputs.args }}
        run: |
          # shellcheck disable=SC2086 — TAG_ARGS is a deliberate flag list.
          docker buildx imagetools create $TAG_ARGS \
            $(printf "${IMAGE}@sha256:%s " *)

  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontends, e2e]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      # id-token is required for npm Trusted Publishing (OIDC). No NPM_TOKEN
      # secret is needed once each package has a Trusted Publisher configured.
      id-token: write
    defaults:
      run:
        working-directory: frontends

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Derive version from tag
        id: ver
        working-directory: ${{ github.workspace }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version '$v' is not valid semver" >&2
            exit 1
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Set up Node.js (for npm Trusted Publishing)
        # Node 24 bundles npm >=11.5.1, which is required for OIDC-based
        # Trusted Publishing. Node 22 ships npm 10.x — that signs provenance
        # but silently omits the OIDC token and the registry returns 404.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Set package versions
        env:
          V: ${{ steps.ver.outputs.v }}
        run: |
          (cd shared && npm pkg set version="$V")
          (cd slidev-component && npm pkg set version="$V")
          # npm publish does not rewrite workspace:* like bun/pnpm do, so pin
          # the cross-package dependency to the concrete release version.
          (cd slidev-component && npm pkg set "dependencies.@slidev-polls/shared"="$V")

      - name: Publish @slidev-polls/shared
        working-directory: frontends/shared
        run: npm publish --access public --provenance

      - name: Publish @slidev-polls/component
        working-directory: frontends/slidev-component
        run: npm publish --access public --provenance

      - name: Job summary
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          V: ${{ steps.ver.outputs.v }}
        run: |
          {
            echo "## npm publish"
            echo ""
            echo "Version: \`$V\`"
            echo ""
            echo "- @slidev-polls/shared@$V"
            echo "- @slidev-polls/component@$V"
          } >> "$GITHUB_STEP_SUMMARY"
