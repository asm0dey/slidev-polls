name: Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: polls
          POSTGRES_PASSWORD: polls
          POSTGRES_DB: polls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polls"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: liberica
          java-version: '25'
          cache: maven

      - name: jOOQ codegen
        run: ./mvnw -B -ntp -Pcodegen -pl backend/poll-persistence -am compile -Dspotless.check.skip=true

      - name: Maven verify (unit + integration tests)
        run: ./mvnw -B -ntp verify -Dspotless.check.skip=true

      - name: Upload Surefire/Failsafe reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: |
            backend/**/target/surefire-reports/**
            backend/**/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7

  frontends:
    name: Frontends (Bun test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontends

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format

      - name: Test (vitest + bun test across workspaces)
        run: bun --filter='*' run test

      - name: Build SPAs
        run: bun --filter='*' run build

      - name: Upload built SPAs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontends/*/dist
          if-no-files-found: ignore
          retention-days: 7
