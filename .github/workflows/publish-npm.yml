name: Publish npm packages

# Publishes @slidev-polls/shared and @slidev-polls/component to npmjs.com on
# release tag. Gated through Test & Build: this workflow only fires after the
# upstream Test & Build succeeds for the tag commit. The tag name (vX.Y.Z) is
# stripped of the leading "v" to derive the npm version.
#
# Order matters: shared is published first because slidev-component depends on
# it via "workspace:*". `bun publish` rewrites that range to the concrete
# version at publish time.

on:
  workflow_run:
    workflows: ["Test & Build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.0.1)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npmjs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Tag-only path: skip unless upstream succeeded on a vX.Y.Z tag, or the
    # operator triggered manually.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          startsWith(github.event.workflow_run.head_branch, 'v')
        )
      }}
    defaults:
      run:
        working-directory: frontends

    steps:
      - name: Resolve target ref and version
        id: ref
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sha="${{ github.sha }}"
            v="${{ inputs.version }}"
          else
            sha="${{ github.event.workflow_run.head_sha }}"
            head="${{ github.event.workflow_run.head_branch }}"
            v="${head#v}"
          fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version '$v' is not valid semver" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Set up Node.js (for npm registry auth)
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Set package versions
        env:
          V: ${{ steps.ref.outputs.v }}
        run: |
          (cd shared && npm pkg set version="$V")
          (cd slidev-component && npm pkg set version="$V")
          # npm publish does not rewrite workspace:* like bun/pnpm do, so pin
          # the cross-package dependency to the concrete release version.
          (cd slidev-component && npm pkg set "dependencies.@slidev-polls/shared"="$V")

      - name: Publish @slidev-polls/shared
        working-directory: frontends/shared
        run: npm publish --access public --provenance

      - name: Publish @slidev-polls/component
        working-directory: frontends/slidev-component
        run: npm publish --access public --provenance

      - name: Job summary
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          V: ${{ steps.ref.outputs.v }}
        run: |
          {
            echo "## npm publish"
            echo ""
            echo "Version: \`$V\`"
            echo ""
            echo "- @slidev-polls/shared@$V"
            echo "- @slidev-polls/component@$V"
          } >> "$GITHUB_STEP_SUMMARY"
