spring:
  application:
    name: poll-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/polls
    username: polls
    password: polls
  flyway:
    enabled: true
    locations: classpath:db/migration
  jooq:
    sql-dialect: POSTGRES

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
