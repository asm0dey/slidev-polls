# Default test slice runs on Postgres (Dev Services). The postgres datasource has no
# jdbc.url in the %test profile (the prod/dev URLs are profile-scoped in main), so Quarkus
# Dev Services starts a throwaway postgres:16-alpine container and injects its URL/creds.
app.database.vendor=postgres
quarkus.datasource.postgres.devservices.image-name=postgres:16-alpine

# The h2 datasource is always injected (JooqConfig/FlywayMigrator wire both vendors). Its
# embedded mem URL is unprofiled in main; Dev Services must not try to manage it.
quarkus.datasource.h2.devservices.enabled=false
