spring:
  application:
    name: poll-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/polls
    username: polls
    password: polls
  flyway:
    enabled: true
    # {vendor} is substituted by Spring Boot's Flyway autoconfig based on the
    # JDBC URL — "postgresql" for jdbc:postgresql://…, "h2" for jdbc:h2:…
    locations: classpath:db/migration/{vendor},classpath:db/migration/common
  session:
    # @EnableJdbcHttpSession (SessionConfig) is the actual activator on Spring Boot 4;
    # store-type is kept for documentation. cleanup-cron is read by a SessionRepositoryCustomizer.
    store-type: jdbc
    timeout: 30m
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 * * * * *"
  jackson:
    deserialization:
      # TS-027 / TS-046: the vote endpoint must ignore unknown properties so a
      # stale client field cannot block a valid vote.
      fail-on-unknown-properties: false

server:
  port: 8080
  servlet:
    session:
      cookie:
        # Session cookie that carries the presenter's authenticated identity.
        # The separate, unauthenticated `sp_voter` cookie is set on the voter
        # path by VoteController (T086) and is configured from code, not here.
        name: SP_SESSION
        http-only: true
        same-site: lax
        # `secure` is turned on by the `prod` profile below so local dev over
        # plain http still works.

---
spring:
  config:
    activate:
      on-profile: prod

server:
  # Honour X-Forwarded-* from the reverse proxy so Tomcat sees the public scheme/
  # host/port. Without this, Spring's CorsUtils#isCorsRequest treats a same-origin
  # voter POST as cross-origin (the request URI's host is the container's, while
  # the browser-set Origin header is the public host) and PerPollCorsConfiguration
  # rejects it with 403 unless the public host is in allowed_origins.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
