quarkus.application.name=poll-api
quarkus.http.port=8080

# --- Multi-datasource (D1b): both vendors built in, runtime flag picks active ---
app.database.vendor=postgres

# Postgres datasource (JTA-enabled so @Transactional governs jOOQ's connection — D2/R1)
quarkus.datasource.postgres.db-kind=postgresql
quarkus.datasource.postgres.jdbc.url=jdbc:postgresql://localhost:5432/polls
quarkus.datasource.postgres.username=polls
quarkus.datasource.postgres.password=polls
quarkus.datasource.postgres.jdbc.transactions=enabled

# H2 datasource (runtime vendor; default embedded file/mem url, override via env)
quarkus.datasource.h2.db-kind=h2
quarkus.datasource.h2.jdbc.url=jdbc:h2:mem:polls;DB_CLOSE_DELAY=-1
quarkus.datasource.h2.jdbc.transactions=enabled

# Flyway runs against the ACTIVE datasource only, programmatically on StartupEvent
# (FlywayMigrator, Phase 2.1b). Disable auto-migrate on both named datasources so the
# inactive vendor's pool is never migrated. Per-vendor locations live in FlywayMigrator.
quarkus.flyway.postgres.migrate-at-start=false
quarkus.flyway.postgres.locations=db/migration/postgresql,db/migration/common
quarkus.flyway.h2.migrate-at-start=false
quarkus.flyway.h2.locations=db/migration/h2,db/migration/common

# Jackson — ignore unknown properties (TS-027/TS-046)
quarkus.jackson.fail-on-unknown-properties=false

# Virtual threads (the SSE/blocking endpoints use @RunOnVirtualThread per Phase 5)
# Session cookie encryption key — supply via env in prod
quarkus.http.auth.session.encryption-key=${SP_SESSION_KEY:change-me-32-bytes-minimum-length!!}

# Admin path permission (role ADMIN required); login/setup are permit-all
quarkus.http.auth.permission.admin.paths=/api/admin/*
quarkus.http.auth.permission.admin.policy=role-admin
quarkus.http.auth.permission.admin-public.paths=/api/admin/login,/api/admin/setup,/api/admin/setup/*
quarkus.http.auth.permission.admin-public.policy=permit
quarkus.http.policy.role-admin.roles-allowed=ADMIN

# Deck path permission (role DECK required); deck login is permit-all (the caller has no token yet)
quarkus.http.auth.permission.deck.paths=/api/deck/*
quarkus.http.auth.permission.deck.policy=role-deck
quarkus.http.auth.permission.deck-public.paths=/api/deck/auth/login
quarkus.http.auth.permission.deck-public.policy=permit
quarkus.http.policy.role-deck.roles-allowed=DECK

# Disable Quarkus global CORS — per-poll CORS is handled by PerPollCorsFilter (D4)
quarkus.http.cors=false

%prod.quarkus.http.proxy.proxy-address-forwarding=true
%prod.quarkus.http.proxy.enable-forwarded-host=true
