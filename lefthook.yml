# Git hooks (https://lefthook.dev). Install with `task hooks:install`.
#
# Runs prettier --write on staged frontend files and spotless:apply on staged
# Java files, re-staging anything the formatters rewrite.

pre-commit:
  parallel: false
  jobs:
    - name: prettier
      root: frontends/
      glob: "**/*.{ts,vue,json,md,yml,yaml,html,css}"
      run: bun run format:files {staged_files}
      stage_fixed: true

    - name: spotless
      glob: "**/*.java"
      run: ./mvnw -q spotless:apply -DspotlessFiles="$(printf '%s\n' {staged_files} | sed "s|^|$PWD/|" | paste -sd,)"
      stage_fixed: true
